name: OM Suivi Quality Gate

on:
  push:
    branches:
      - main
      - fix/om-suivi-foundation-stability
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: om-suivi-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web typecheck and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Reconcile and install web dependencies
        run: npm install --no-audit --no-fund
      - name: Apply non-breaking dependency security updates
        run: |
          npm audit fix --no-fund --no-progress || true
          npm ci
      - name: Audit web dependencies (full and production)
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit-full.json" || true
          npm audit --omit=dev --json > "$RUNNER_TEMP/npm-audit-production.json" || true
          node - "$RUNNER_TEMP/npm-audit-full.json" "$RUNNER_TEMP/npm-audit-production.json" <<'NODE'
          const fs = require('node:fs');
          for (const file of process.argv.slice(2)) {
            const report = JSON.parse(fs.readFileSync(file, 'utf8'));
            const counts = report.metadata?.vulnerabilities ?? {};
            console.log(JSON.stringify({ report: file.includes('production') ? 'production' : 'full', counts }));
            for (const [name, item] of Object.entries(report.vulnerabilities ?? {})) {
              if (['critical', 'high'].includes(item.severity)) {
                console.log(JSON.stringify({ name, severity: item.severity, direct: item.isDirect, range: item.range, fixAvailable: item.fixAvailable }));
              }
            }
          }
          NODE
      - name: TypeScript check
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Commit updated web lockfile on the stabilization branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/om-suivi-foundation-stability'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Web lockfile is already synchronized."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(web): apply compatible dependency security updates"
            git push
          fi

  functions:
    name: Firebase Functions compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: .
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Regenerate and verify Functions lockfile
        run: |
          npm install --no-audit --no-fund
          npm ci --no-audit --no-fund
      - name: Compile Functions
        run: npm run build
      - name: Upload regenerated Functions lockfile
        uses: actions/upload-artifact@v4
        with:
          name: functions-package-lock
          path: functions/package-lock.json
      - name: Commit synchronized lockfile on the stabilization branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/fix/om-suivi-foundation-stability'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Functions lockfile is already synchronized."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore(functions): synchronize package lockfile"
            git push
          fi
