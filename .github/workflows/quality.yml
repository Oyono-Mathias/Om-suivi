name: OM Suivi Quality Gate

on:
  push:
    branches:
      - main
      - fix/om-suivi-foundation-stability
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: om-suivi-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web typecheck and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install web dependencies
        run: npm ci
      - name: TypeScript check
        run: npm run typecheck
      - name: Production build
        run: npm run build

  functions:
    name: Firebase Functions compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: .
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Functions dependencies
        run: npm install --no-audit --no-fund
      - name: Compile Functions
        run: npm run build
